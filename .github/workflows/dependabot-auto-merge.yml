name: Dependabot auto-merge

# WHY THIS EXISTS
# ---------------
# `claude-review.yml`'s review-and-merge job deliberately SKIPS dependabot PRs
# (a three.js bump can pass tsc/vitest/CodeQL/OSV and still break the render on
# the live site). But dependabot is ~100% of this repo's PR traffic, so that
# skip left the hands-off pipeline dead: every pull_request-triggered run of
# claude-review since 2026-07-13 concluded `skipped`, and every dependency PR
# (#137, #139, #140, #142, #143, #146) was merged BY HAND.
#
# This workflow restores automation for the safe subset without giving up the
# guard that motivated the skip. The split is by BLAST RADIUS, not by author:
#   - github-actions bumps  -> CI-only, cannot reach the shipped bundle. Merge.
#   - npm devDependencies   -> gated by lint + test + build + E2E. Merge.
#   - npm prod deps (three) -> ships to players. HOLD for review.
#   - any npm major         -> HOLD for review, regardless of dep type.
# Anything held gets a comment explaining why, so it never just sits silently
# the way #146 did for two days.
#
# HELD PRs GO TO THE AUTOMATED CLAUDE REVIEW, not to a hand merge. Once their
# blocking checks are green this workflow dispatches `claude-review.yml` with
# `pr_number` — the same `gh workflow run` call `pr-sweeper.yml` makes — and
# that run reviews the diff, then merges or tags Craig and holds. Before this,
# held PRs waited ~24h for the sweeper to do the same dispatch.
#   - Waiting for green first matters: E2E (the render check) is not a
#     required status check on `main`, so a review dispatched at `opened`
#     could merge a `three` bump before E2E had reported. Red checks fail this
#     job and do NOT dispatch; pr-sweeper.yml picks those up after 24h.
#   - Exactly one dispatch per PR. State lives in the hold comment (hidden
#     markers `auto-merge-hold` / `claude-review-dispatched`), so every trigger
#     — including a `synchronize` rebase that cancels an in-flight wait — can
#     run this safely and only the first green run dispatches. A dispatch on
#     every rebase would re-run a full Opus review each time; claude-review's
#     concurrency (one group per event + PR, cancel-in-progress) would only
#     cancel the older run mid-review, not dedupe it.
#   - A `workflow_dispatch` made with GITHUB_TOKEN does start a run — it is one
#     of the documented exceptions to the no-recursion rule:
#     https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
#     The dispatched run executes main's claude-review.yml in its own context,
#     which is where CLAUDE_CODE_OAUTH_TOKEN is available.

on:
  # pull_request_target, NOT pull_request. Workflow runs triggered by Dependabot
  # get a READ-ONLY GITHUB_TOKEN by default on the `pull_request` event. A
  # `permissions:` block CAN raise that token (GitHub: "You can use the
  # `permissions` key in your workflow to increase the access for the token"),
  # https://docs.github.com/en/code-security/reference/supply-chain-security/troubleshoot-dependabot/dependabot-on-actions
  # so the token alone does not force this trigger. This workflow uses
  # pull_request_target, which runs the workflow definition from the BASE
  # branch (main) — a PR cannot edit the copy that runs with write access —
  # and gets its write scopes from the job's `permissions:` block below.
  #
  # The usual pull_request_target danger is checking out and EXECUTING PR code
  # under that privileged token. This workflow never checks out the PR at all —
  # there is no `actions/checkout` step, and every step is either the metadata
  # action or a `gh` API call keyed by PR number. The PR's code is only ever
  # executed by the ordinary `pull_request` workflows (CI, E2E, Semgrep), which
  # run unprivileged. Keep it that way: do NOT add a checkout of the head ref.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Default read-only; the job below elevates to exactly what it needs.
permissions:
  contents: read

concurrency:
  # A new push to the PR supersedes an in-flight wait for the older commit.
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # Same-repo head only: dependabot branches live in this repo, never a fork.
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # squash-merge and delete the branch
      pull-requests: write # post / update the hold comment
      actions: write # gh workflow run claude-review.yml (held PRs)
    # Generous: the slowest blocking check (E2E) finishes ~1m20s, but Lighthouse
    # and the validation soak run ~4m and the wait loop polls until everything
    # settles. 30m leaves room for a queued-runner backlog.
    timeout-minutes: 30
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      # Decide merge vs. hold BEFORE burning ~5 minutes waiting on checks.
      - name: Apply merge policy
        id: policy
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          echo "ecosystem=$ECOSYSTEM type=$DEP_TYPE update=$UPDATE_TYPE names=$DEP_NAMES"

          merge=false
          reason=""

          # BRANCH ORDER IS LOAD-BEARING — do not reorder these arms.
          # Dependabot labels GitHub Actions bumps `dependency-type:
          # direct:production` (verified on the #146 commit trailer for
          # github/codeql-action). "production" there means "not a dev
          # dependency of the action", NOT "ships to players". If the
          # production arm ran first, every action bump would be held and this
          # workflow would merge nothing at all — the exact stall it exists to
          # fix. The ecosystem test must stay ahead of it.
          #
          # `github_actions` is spelled with an UNDERSCORE: fetch-metadata
          # derives package-ecosystem by splitting the branch name
          # (dependabot/github_actions/...), not from dependabot.yml, where the
          # same ecosystem is written `github-actions` with a hyphen.
          if [[ "$ECOSYSTEM" == "github_actions" ]]; then
            # Action bumps only touch .github/workflows — they cannot change a
            # single byte of the bundle Vercel serves. A bump that breaks CI
            # itself is self-gating: the blocking checks go red and the wait
            # step refuses the merge.
            merge=true
          elif [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            # Majors get eyes even for dev deps: a vitest or eslint major can go
            # green while silently dropping test coverage or rules.
            reason="major version bump — majors always get a review"
          elif [[ "$DEP_TYPE" == *"production"* ]]; then
            # three / any runtime dep ships to players. This is the exact case
            # claude-review.yml's dependabot skip was written to protect.
            reason="production dependency — ships to players"
          elif [[ "$DEP_TYPE" == *"development"* ]]; then
            merge=true
          else
            # indirect/transitive, or metadata the action could not classify.
            reason="dependency type '$DEP_TYPE' is not on the auto-merge allowlist"
          fi

          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      # Explain the hold once per PR, and read back whether the Claude review
      # was already dispatched. Both facts live in one comment, keyed by hidden
      # markers, so a rebase never re-comments or re-dispatches. pr-sweeper.yml
      # ignores comments carrying `auto-merge-hold` — without that it would
      # take this github-actions[bot] comment for a finished Claude review.
      - name: Post or find the hold comment
        id: hold
        if: steps.policy.outputs.merge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: |
          set -euo pipefail
          found=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '
            .[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- auto-merge-hold -->")))
                | "\(.id) \(.body | contains("<!-- claude-review-dispatched -->"))"')
          found=${found%%$'\n'*}

          if [[ -n "$found" ]]; then
            read -r id dispatched <<<"$found"
            echo "Hold comment $id already posted (review dispatched: $dispatched)."
          else
            # Built with printf rather than a multi-line string literal: this
            # `run:` block is indented inside the YAML, and every continuation
            # line of a quoted literal would carry that indentation into the
            # comment body. At 4+ leading spaces GitHub renders Markdown as a
            # code block, so the whole notice would come out preformatted.
            # The single quotes are deliberate — the backticks inside are
            # Markdown code spans for the rendered comment, not command
            # substitution, so they must NOT expand.
            # shellcheck disable=SC2016
            BODY=$(printf '%s\n' \
              '<!-- auto-merge-hold -->' \
              "**Held for the automated Claude review** — $REASON." \
              '' \
              'CI still runs normally — this PR just will not merge itself.' \
              'Once the blocking checks are green, `claude-review.yml` is dispatched for it: Claude reviews the diff, then merges it or tags Craig and holds it.' \
              '' \
              '_Policy lives in `.github/workflows/dependabot-auto-merge.yml`._')
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" --jq .id)
            dispatched=false
            echo "Posted hold comment $id."
          fi
          echo "comment_id=$id" >> "$GITHUB_OUTPUT"
          echo "dispatched=$dispatched" >> "$GITHUB_OUTPUT"

      # Wait for the checks that actually gate a merge.
      #
      # Blocking = every check whose name does NOT end in "(non-blocking)",
      # PLUS the E2E suite. E2E is marked non-blocking for humans, but it is the
      # ONLY check that exercises the rendered game, so it is the one thing
      # standing between a bad dev-dep bump and a broken live site. For an
      # unattended merge it is required.
      #
      # Deliberately still advisory here: Lighthouse and the live validation
      # soak both run against a Vercel preview and are flaky-by-nature (network,
      # cold starts); letting them veto an unattended merge would trade one
      # stuck-PR problem for another.
      #
      # Held PRs wait here too (until their review is dispatched), so Claude
      # never reviews — and possibly merges — before E2E has reported.
      - name: Wait for blocking checks
        if: steps.policy.outputs.merge == 'true' || steps.hold.outputs.dispatched == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          NEXT_STEP: ${{ steps.policy.outputs.merge == 'true' && 'merge' || 'dispatch the Claude review (pr-sweeper.yml retries after 24h)' }}
        run: |
          set -euo pipefail

          # This job is itself a check run on the PR head SHA. Filtering it out
          # is load-bearing: without it the loop waits on its own `pending`
          # state and deadlocks until the 30m timeout.
          SELF="Dependabot auto-merge"

          # The three CI jobs must all be PRESENT before "nothing pending" can
          # mean "everything passed". Right after `opened`, GitHub has often
          # registered no check runs yet — an empty list trivially satisfies
          # "zero pending" and would merge the PR having verified nothing.
          CORE='["Lint","Test","Build"]'

          for attempt in $(seq 1 60); do
            # `gh pr checks` exits 8 while checks are still pending, so a bare
            # `|| echo '[]'` would append to the JSON gh already printed and
            # produce a malformed document. Swallow the status, then validate.
            raw=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,workflow 2>/dev/null) || true
            jq -e 'type == "array"' >/dev/null 2>&1 <<<"$raw" || raw='[]'

            blocking=$(jq -c --arg self "$SELF" '
              [ .[]
                | select(.workflow != $self)
                | select((.name | endswith("(non-blocking)") | not) or (.name | startswith("E2E")))
              ]' <<<"$raw")

            pending=$(jq -r '[.[] | select(.bucket == "pending")] | length' <<<"$blocking")
            failed=$(jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | .name' <<<"$blocking")
            missing=$(jq -r --argjson core "$CORE" '
              ($core - [.[].name]) | join(", ")' <<<"$blocking")

            if [[ -n "$failed" ]]; then
              echo "::error::Blocking checks failed, refusing to ${NEXT_STEP}:"
              while IFS= read -r name; do echo "  - $name"; done <<<"$failed"
              exit 1
            fi

            if [[ "$pending" == "0" && -z "$missing" ]]; then
              echo "All blocking checks settled:"
              jq -r '.[] | "  \(.bucket)\t\(.name)"' <<<"$blocking"
              exit 0
            fi

            if [[ -n "$missing" ]]; then
              echo "attempt $attempt: waiting for core checks to register: $missing"
            else
              echo "attempt $attempt: $pending blocking check(s) still pending…"
            fi
            sleep 20
          done

          echo "::error::Timed out waiting for blocking checks."
          exit 1

      # Same mechanism and input as pr-sweeper.yml. `gh workflow run` targets
      # the default branch, so main's claude-review.yml runs, never the PR's.
      # The marker goes on only after the dispatch call succeeded; if the
      # dispatch itself fails, this step goes red and no marker is written.
      - name: Dispatch the Claude review
        if: steps.policy.outputs.merge != 'true' && steps.hold.outputs.dispatched == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COMMENT_ID: ${{ steps.hold.outputs.comment_id }}
        run: |
          set -euo pipefail
          gh workflow run claude-review.yml --repo "$GITHUB_REPOSITORY" -f pr_number="$PR"
          echo "Dispatched claude-review.yml for PR #$PR."

          body=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" --jq .body)
          note="_Checks green — Claude review dispatched $(date -u +'%Y-%m-%d %H:%M UTC') by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
            -f body="${body}"$'\n\n<!-- claude-review-dispatched -->\n'"${note}" > /dev/null

      - name: Squash merge
        if: steps.policy.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Plain squash, NOT --auto: `--auto` waits only for the REQUIRED status
          # checks, and the `protect-main` ruleset requires just Lint, Test and
          # Build. E2E is not required, so `--auto` would merge as soon as those
          # three are green — before the render smoke had reported. The wait
          # step above is the only gate that covers E2E.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
