name: Claude PR Review & Merge

on:
  pull_request:
    # `ready_for_review` is a deliberate divergence from ClawApp parity (shared
    # across the static-game fleet): visual PRs open as DRAFT, get playtested on
    # device, then are marked "Ready for review" — that transition fires this
    # trigger so the auto-merge runs hands-off. (Drafts still can't be merged:
    # GitHub blocks merging a draft PR, so `gh pr merge` no-ops until the PR is
    # ready.)
    types: [opened, synchronize, ready_for_review]
    # Skip auto-review on PRs that only edit this workflow file. The
    # `anthropics/claude-code-action@v1` action refuses to run when its
    # workflow file differs from the version on `main` (a security check that
    # prevents attackers from PRing malicious workflow edits and having the
    # action execute them under privileged context). On a single-developer
    # personal repo there's no attacker, but the action still self-fails with
    # exit 1 every time, leaving a recurring red ✗ on every workflow-edit PR.
    # `paths-ignore` short-circuits the trigger so the workflow doesn't run at
    # all on those PRs. Comment-driven `@claude` invocations still fire (they're
    # on the `issue_comment` trigger below) to review a workflow-edit PR.
    paths-ignore:
      - '.github/workflows/claude-review.yml'
  issue_comment:
    types: [created]
  # Dispatched by pr-sweeper.yml for PRs whose review never finished
  # (skipped, cancelled, or a Dependabot PR held for review — Dependabot
  # `pull_request` runs get no repo secrets). workflow_dispatch is one of the
  # few events GITHUB_TOKEN may trigger; it runs in main's context with full
  # secrets, and only accounts with write access can dispatch it.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

# Workflow-level default: read-only. The review-and-merge job below overrides
# with the write scopes the action actually needs (contents, pull-requests,
# issues, id-token). Defining the workflow default explicitly so any future job
# added here inherits a minimum-privilege baseline rather than the implicit
# Actions default.
permissions:
  contents: read

concurrency:
  # Scope by EVENT TYPE. Without this, a bot comment (issue_comment — e.g.
  # vercel[bot]'s preview-deploy comment, which lands on every PR) shares the
  # same group as the pull_request review run and, with cancel-in-progress,
  # CANCELS it mid-flight ("Set up job: cancelled") before it can merge. Observed
  # directly: a vercel[bot] comment killed the review run ~2s after it started.
  # Including event_name keeps comment events in their own group; within an event
  # type, cancel-in-progress still supersedes a stale run (a new push cancels an
  # older review of the same PR).
  # Comments that cannot start a review (Claude's own tracking comment,
  # vercel[bot] / dependabot notes, plain chatter) get a throwaway per-run
  # group. Without this, the tracking comment Claude posts at the start of
  # every `@claude` run lands in the SAME issue_comment group and
  # cancel-in-progress kills the live review ~1 min in — observed on
  # wild-trails #215 and rogue-descent #173 (2026-10-26), cologne-service #100.
  # Same fix as ClawApp and cologne-service #101.
  group: >-
    claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}${{
    (github.event_name == 'issue_comment' && (github.event.comment.user.type == 'Bot' || !contains(github.event.comment.body, '@claude')))
    && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review-and-merge:
    # The action pushes commits using ${{ github.token }} (the workflow's
    # default GITHUB_TOKEN), so commits authored by this workflow appear under
    # `github-actions[bot]`, NOT `claude[bot]`. Both guards below check
    # `github-actions[bot]`. If you ever switch to the Claude GitHub App by
    # passing `github_token` to the action, change both checks to `claude[bot]`.
    #
    # TRUST GATE (pull_request path): run only on PRs whose head branch lives in
    # THIS repo (head.repo.full_name == github.repository) — i.e. created by a
    # write-access user, never an outside fork. That is the exact security
    # property the privileged SHA-pinned checkout needs, and it is independent of
    # org-membership visibility.
    #
    # WHY NOT author_association: it was `== OWNER || MEMBER`, but the Actions
    # EVENT payload only reports MEMBER for PUBLIC org members. The operator's
    # membership in this org is PRIVATE, so the payload reported a lesser
    # association, the if was always false, and review-and-merge was SKIPPED on
    # every PR — the auto-merge never ran (all PRs were merged by hand). Evidence:
    # GET /orgs/craigoley/public_members/<user> -> 404 (private) while the
    # authenticated REST API reads MEMBER. The same-repo check is not subject to
    # that visibility quirk. (The issue_comment path below still uses
    # author_association and has the same latent limitation — out of scope here;
    # it is not part of the hands-off auto-merge pipeline.)
    #
    # draft == false preserves the DRAFT GATE: draft PRs are neither reviewed nor
    # merged. Marking a draft "Ready for review" fires ready_for_review (see the
    # trigger above), flips draft to false, and lets the run proceed.
    #
    # Dependabot PRs are SKIPPED here — deliberate fleet deviation from ClawApp:
    # a three.js / Vite bump can pass tsc, vitest, CodeQL and OSV yet still break
    # the render and auto-deploy to the public site.
    #
    # That skip is NOT "dependency PRs are merged by hand". Dependabot is ~100%
    # of this repo's PR traffic, so for a while it meant no automation ran at all
    # and every bump was merged manually. `.github/workflows/dependabot-auto-merge.yml`
    # now owns that lane: it auto-merges the blast-radius-zero subset
    # (github-actions bumps, non-major devDependencies) behind lint/test/build/
    # E2E, and holds production deps and majors for a human — which is the case
    # this skip was actually written to protect. Keep the two files in sync: if
    # you widen the policy there, revisit the rationale here.
    #
    # github-actions[bot] is skipped to prevent self-loops on Claude's push-backs.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       github.event.pull_request.user.login != 'github-actions[bot]' &&
       !contains(github.event.pull_request.head.ref, 'claude-fix'))
      ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER') &&
       contains(github.event.comment.body, '@claude'))
      ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    timeout-minutes: 30
    steps:
      - name: Check last commit author
        id: check-author
        if: github.event_name == 'pull_request'
        run: |
          # The action commits via ${{ github.token }} → author is
          # `github-actions[bot]`. If the workflow authored the last commit we
          # skip, so Claude's own push-backs don't re-trigger an endless loop.
          AUTHOR=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json commits --jq '.commits[-1].authors[0].login // ""')
          if [[ "$AUTHOR" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Exit if the workflow authored the last commit
        if: steps.check-author.outputs.skip == 'true'
        run: |
          echo "Last commit was by github-actions[bot] (this workflow) — skipping to prevent loop."
          exit 0

      # Resolve the PR head SHA from the API at trigger time so the subsequent
      # checkout pins to an immutable commit instead of a mutable branch ref.
      # Guards against an Untrusted-Checkout TOCTOU: without it, someone who can
      # push to the PR branch could force-push between the author check above and
      # the checkout, running their code under privileged context.
      - name: Resolve PR head SHA and branch
        id: pr-sha
        if: steps.check-author.outputs.skip != 'true'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}"
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid,headRefName)
          SHA=$(echo "$PR_JSON" | jq -r .headRefOid)
          BRANCH=$(echo "$PR_JSON" | jq -r .headRefName)
          if [[ -z "$SHA" || "$SHA" == "null" ]]; then
            echo "Could not resolve head SHA for PR #$PR_NUMBER" >&2
            exit 1
          fi
          if [[ -z "$BRANCH" || "$BRANCH" == "null" ]]; then
            echo "Could not resolve head branch for PR #$PR_NUMBER" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # THE REVIEW PROMPT LIVES IN .github/claude-review/prompt.md, not inline
      # here. claude-code-action refuses to run on a PR whose copy of this
      # workflow differs from the default branch's ("Workflow validation
      # failed"), so while the prompt was inline every prompt edit needed a
      # hand merge. Moving it out of this file lets prompt edits go through the
      # normal review + merge.
      #
      # SECURITY: the prompt is read from the DEFAULT BRANCH through the API,
      # never from the PR checkout (which holds the PR's own copy). A PR must
      # not be able to rewrite its own reviewer's instructions, so a prompt
      # edit takes effect only for runs after it merges, and the PR making it
      # is reviewed under main's current prompt. A missing or empty file is a
      # job error: there is deliberately no fallback to the PR's copy.
      #
      # Placeholders ({{REPO}}, {{PR_NUMBER}}, {{BRANCH}}) are filled in
      # one regex pass in Python, so a value containing sed metacharacters or
      # another placeholder lands verbatim. An unknown placeholder fails the job
      # rather than reaching the model unrendered. Runs before the checkout,
      # so the workspace holds no PR code yet.
      - name: Load review prompt from the default branch
        id: prompt
        if: steps.check-author.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
          BRANCH: ${{ steps.pr-sha.outputs.branch }}
        run: |
          set -euo pipefail
          PROMPT_PATH=.github/claude-review/prompt.md
          if [[ -z "$DEFAULT_BRANCH" ]]; then
            echo "::error::Could not determine the default branch from the event payload."
            exit 1
          fi
          # Pin the read to one commit so the log says exactly which prompt ran.
          REF_SHA=$(gh api "repos/$REPO/commits/$DEFAULT_BRANCH" --jq .sha)
          TEMPLATE="$RUNNER_TEMP/review-prompt.template.md"
          RENDERED="$RUNNER_TEMP/review-prompt.md"
          if ! gh api "repos/$REPO/contents/$PROMPT_PATH?ref=$REF_SHA" \
               -H "Accept: application/vnd.github.raw" > "$TEMPLATE"; then
            echo "::error::Could not read $PROMPT_PATH from $DEFAULT_BRANCH ($REF_SHA). Refusing to review without it."
            exit 1
          fi
          echo "Loaded $PROMPT_PATH from $DEFAULT_BRANCH@$REF_SHA ($(wc -c < "$TEMPLATE") bytes)."

          python3 -I - "$TEMPLATE" "$RENDERED" <<'PY'
          import os, re, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, encoding="utf-8") as f:
              text = f.read()
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          if not text.strip():
              fail("prompt.md on the default branch is empty.")
          values = {k: os.environ.get(k, "") for k in ("REPO", "PR_NUMBER", "BRANCH")}
          missing = [k for k, v in values.items() if not v]
          if missing:
              fail(f"No value for placeholder(s): {', '.join(missing)}")
          pattern = re.compile(r"\{\{([A-Z_]+)\}\}")
          unknown = sorted({name for name in pattern.findall(text) if name not in values})
          if unknown:
              fail(f"prompt.md uses unknown placeholder(s): {', '.join(unknown)}")
          with open(dst, "w", encoding="utf-8") as f:
              f.write(pattern.sub(lambda m: values[m.group(1)], text))
          PY

          # Random delimiter, so no line of the prompt can end the value early.
          DELIM="PROMPT_$(openssl rand -hex 16)"
          if grep -qF "$DELIM" "$RENDERED"; then
            echo "::error::Delimiter collision; re-run the job."
            exit 1
          fi
          {
            echo "text<<$DELIM"
            cat "$RENDERED"
            [[ -z "$(tail -c1 "$RENDERED")" ]] || echo
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Privileged checkout, reachable from the issue_comment trigger. CodeQL
      # may flag this (actions/untrusted-checkout); the sanitizers are in place:
      #   1. the job-level `if:` requires author_association in (OWNER, MEMBER)
      #      AND, for comments, an `@claude` body — only the owner can fire it.
      #   2. `ref:` is the resolved-at-trigger-time head SHA, not the mutable
      #      branch ref, so a force-push after the trust check can't swap it out.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.check-author.outputs.skip != 'true'
        with:
          # SHA-pinned (immutable). NOT `head.ref` — branch refs are mutable and
          # race the `Check last commit author` step above.
          ref: ${{ steps.pr-sha.outputs.sha }}
          fetch-depth: 0

      # Re-attach HEAD to a named local branch matching the PR's head branch.
      # actions/checkout@v6 leaves a detached HEAD when given a SHA, and the
      # action's push-back code is most portable pushing from a named local
      # branch with a matching upstream. If the remote branch was force-pushed
      # since we resolved the SHA, the push is rejected as non-fast-forward —
      # the desired fail-closed behavior.
      - name: Re-attach HEAD to PR branch for push-back
        if: steps.check-author.outputs.skip != 'true'
        # PR head ref names are caller-controlled and could contain shell
        # metacharacters. Pass through env rather than `${{ … }}` interpolation
        # so bash sees the literal string via `$BRANCH` (guards code injection).
        env:
          BRANCH: ${{ steps.pr-sha.outputs.branch }}
        run: |
          git checkout -B "$BRANCH"
          git branch --set-upstream-to="origin/$BRANCH" "$BRANCH" 2>/dev/null || true

      - uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33  # v1
        if: steps.check-author.outputs.skip != 'true'
        env:
          # Authenticate the gh CLI used by the Bash tool (gh pr comment/merge).
          GH_TOKEN: ${{ github.token }}
        with:
          # OAuth via Craig's Max subscription — same auth ClawApp uses.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Force tag mode so the review summary posts as a tracking comment.
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          # pr-sweeper dispatches with GITHUB_TOKEN, so the actor is github-actions[bot].
          allowed_bots: ${{ github.event_name == 'workflow_dispatch' && 'github-actions[bot]' || '' }}
          # Rendered by "Load review prompt from the default branch" above, from
          # .github/claude-review/prompt.md on the default branch.
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-4-8
            --max-turns 50
            --allowedTools "Edit,Write,Read,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(npx tsc:*),Bash(npm test:*),mcp__github_inline_comment__create_inline_comment"
